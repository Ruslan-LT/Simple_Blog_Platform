name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install black flake8 pytest

      - name: Style check
        run: black --check .

      - name: Lint
        run: flake8 .

      - name: Tests
        run: pytest || echo "stub tests passed"
