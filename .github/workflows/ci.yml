name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

  django-ci:
    name: Django CI
    runs-on: ubuntu-latest
    needs: commitlint

    steps:

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Django system check
        run: |
          python manage.py check

      - name: Run flake8
        run: |
          flake8 .

      - name: Run pylint
        run: |
          pylint **/*.py || true

      - name: Run tests
        run: |
          pytest
